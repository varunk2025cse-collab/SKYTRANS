spring.application.name=SKYTRANS

# Database connection. The password must be supplied through the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring_skytrans_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Chart of accounts used by automatic journal postings.
# Each code must exist in the accounts table (the Accounts page).
skytrans.accounts.bank=1000
skytrans.accounts.receivable=1200
skytrans.accounts.payable=2000
# Expense accounts compared against the budget report
skytrans.accounts.electricity-expense=5000
skytrans.accounts.maintenance-expense=5100
